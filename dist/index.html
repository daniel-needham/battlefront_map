<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b10">
  <meta name="description" content="Travel from Earth to a satellite view of a location.">
  <title>Earth</title>
  <link rel="stylesheet" href="./vendor/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Satellite map" aria-hidden="true"></div>
    <canvas id="globe" aria-label="NASA Blue Marble globe"></canvas>
    <canvas id="hud" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>
    <div class="controls">
      <button id="back" type="button" hidden>Back to globe</button>
      <form id="location-form" novalidate>
        <label class="visually-hidden" for="location">Location coordinates</label>
        <input id="location" name="location" placeholder="Latitude, longitude" value="51.5074, -0.1278" autocomplete="off" spellcheck="false" aria-describedby="message">
        <button id="go" type="submit" disabled>Go</button>
        <button id="cancel" type="button" hidden>Cancel</button>
      </form>
      <p id="message" role="status" aria-live="polite">Loading Earth…</p>
    </div>
    <div class="credits"><a href="https://science.nasa.gov/earth/earth-observatory/the-blue-marble-true-color-global-imagery-at-1km-resolution/" target="_blank" rel="noopener">NASA</a><span id="satellite-credit" hidden> · <a href="https://cloudless.eox.at/" target="_blank" rel="noopener">Sentinel-2 cloudless by EOX</a> · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA</a></span></div>
  </main>
  <noscript>Enable JavaScript to view the globe.</noscript>
  <script src="./vendor/maplibre-gl.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
